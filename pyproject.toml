[project]
name = "ccscraper"
version = "0.1.0"
description = "Self-hosted scraper service with staged fallback extraction"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "redis>=5.0",
    "arq>=0.26",
    "orjson>=3.9",
    "structlog>=24.1",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    # The /mcp endpoint is mounted into this same app, so the MCP SDK ships
    # in the light api image rather than the browser-heavy worker one.
    "mcp>=2.1",
]
worker = [
    # httpx is still the robots.txt client - a well-known text file whose
    # fetch is not what gets fingerprinted.
    "httpx>=0.27",
    "protego>=0.3.1",
    # Stage 1: real browser TLS/JA3 + HTTP/2 fingerprints. hp.com and
    # acer.com return zero bytes to a plain client and 200 to this one.
    "curl_cffi>=0.7",
    # Stage 2: patched Firefox. Pulls playwright in transitively, which
    # pipeline/consent/dismiss.py imports directly.
    "camoufox[geoip]>=0.4",
    # Stage 3: Chromium over CDP with no WebDriver attached.
    "seleniumbase>=4.30",
    "trafilatura>=1.8",
    # trafilatura -> justext imports lxml.html.clean, which lxml split out
    # into this separate package starting at lxml 5.2. Depend on it
    # directly by name, not via `lxml[html_clean]` - that extra is not
    # actually declared in current lxml (6.x) release metadata, so pip
    # silently no-ops it (warns, doesn't error) and the worker still
    # crashes on import. Verified against a from-scratch venv, not assumed.
    "lxml_html_clean",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.20",
]

[tool.pytest.ini_options]
markers = [
    "live: hits the real network (bot-detection endpoints); deselected by default",
]
addopts = "-m 'not live'"
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Auto-discover rather than list literally: api.Dockerfile and
# worker.Dockerfile each COPY a different subset of these directories into
# the build context (api skips worker/pipeline entirely to stay light), so
# a hardcoded list fails whichever image doesn't have every directory.
include = ["app*", "worker*", "pipeline*", "extract*", "common*"]
