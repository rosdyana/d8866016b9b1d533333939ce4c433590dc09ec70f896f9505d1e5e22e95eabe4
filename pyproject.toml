[project]
name = "ccscraper"
version = "0.1.0"
description = "Self-hosted scraper service with staged fallback extraction"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "redis>=5.0",
    "arq>=0.26",
    "orjson>=3.9",
    "structlog>=24.1",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    # The /mcp endpoint is mounted into this same app, so the MCP SDK ships
    # in the light api image rather than the browser-heavy worker one.
    "mcp>=2.1",
]
worker = [
    "protego>=0.3.1",
    # Stage 1 *and* the robots.txt gate: real browser TLS/JA3 + HTTP/2
    # fingerprints. hp.com and acer.com return zero bytes to a plain client
    # and 200 to this one - including for /robots.txt, which is why the
    # gate no longer uses httpx.
    "curl_cffi>=0.7",
    # Stage 3: patched Firefox. Pulls playwright in transitively, which
    # pipeline/consent/dismiss.py imports directly.
    "camoufox[geoip]>=0.4",
    # Stage 4: Chromium over CDP with no WebDriver attached.
    "seleniumbase>=4.30",
    # Stage 2 *and* the HTML -> Markdown converter every other stage's
    # output goes through (`extract/converter.py`). It is a heavy
    # dependency - litellm, numpy, pillow, nltk, bs4, rank-bm25,
    # snowballstemmer, shapely, playwright, patchright - and worth it only
    # because it earns its place twice. Needs `playwright install chromium`
    # (see docker/worker.Dockerfile); camoufox's own Firefox is separate.
    "crawl4ai>=0.9.3",
    # Stage 5. Brings httpx back as a worker runtime dependency - which is
    # fine here and nowhere else: it only ever talks to api.firecrawl.dev,
    # a first-party API that does not fingerprint us.
    "firecrawl-py>=4.41",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    # respx mocks it, and the API routes are driven through
    # httpx.ASGITransport. The worker also gets httpx transitively via
    # firecrawl-py, but no code path of ours uses it to fetch a target.
    "httpx>=0.27",
    "respx>=0.20",
]

[tool.pytest.ini_options]
markers = [
    "live: hits the real network (bot-detection endpoints); deselected by default",
]
addopts = "-m 'not live'"
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Auto-discover rather than list literally: api.Dockerfile and
# worker.Dockerfile each COPY a different subset of these directories into
# the build context (api skips worker/pipeline entirely to stay light), so
# a hardcoded list fails whichever image doesn't have every directory.
include = ["app*", "worker*", "pipeline*", "extract*", "common*"]
