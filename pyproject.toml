[project]
name = "ccscraper"
version = "0.1.0"
description = "Self-hosted scraper service with staged fallback extraction"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "redis>=5.0",
    "arq>=0.26",
    "orjson>=3.9",
    "structlog>=24.1",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]
worker = [
    "httpx>=0.27",
    "protego>=0.3.1",
    "playwright>=1.42",
    "trafilatura>=1.8",
    # trafilatura -> justext imports lxml.html.clean, which lxml split out
    # into this separate package starting at lxml 5.2. Depend on it
    # directly by name, not via `lxml[html_clean]` - that extra is not
    # actually declared in current lxml (6.x) release metadata, so pip
    # silently no-ops it (warns, doesn't error) and the worker still
    # crashes on import. Verified against a from-scratch venv, not assumed.
    "lxml_html_clean",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.20",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Auto-discover rather than list literally: api.Dockerfile and
# worker.Dockerfile each COPY a different subset of these directories into
# the build context (api skips worker/pipeline entirely to stay light), so
# a hardcoded list fails whichever image doesn't have every directory.
include = ["app*", "worker*", "pipeline*", "extract*", "common*"]
